name: App Deploy to Vercel
on:
  pull_request:
    branches:
      - main
      
      
jobs:
  issuecomment-workflow:
    uses: ./.github/workflows/cctweb-issuecomment.yml
    with:
       echo "Issue Number: ${{ github.event.issue.number }}"
       echo "Owner: ${{ github.repository_owner }}"
       echo "Repo: ${{ github.event.repository.name }}"
